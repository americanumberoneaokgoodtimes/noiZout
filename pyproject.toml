[project]
name = "zout"
version = "0.1.0"
description = "Reference-conditioned audio denoiser / voice restoration with a rich hotkey TUI"
requires-python = ">=3.10,<3.13"
dependencies = [
  "rich>=14",
  "numpy>=1.24,<2",
  "scipy>=1.11",
  "soundfile>=0.12",
  "soxr>=0.3",
  "scikit-learn>=1.4",
  "voxlock>=1.3.0",
  "onnxruntime>=1.17",
  "deepfilternet-slim>=0.1.0; platform_system == 'Windows'",
  "noisereduce>=3.0.3",
  "huggingface_hub>=0.26",
  "pysilero-vad>=3.4.0",
  "webrtcvad-wheels>=2.0.14",
  "sounddevice>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
zout = "zout.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zout", "zout.tui", "zout.audio", "zout.engines"]

[tool.pytest.ini_options]
markers = ["slow: downloads models"]
